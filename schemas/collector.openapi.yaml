openapi: 3.1.0
info:
  title: Request X-Ray Query API
  version: 0.1.0
  description: Planned local query API; NOT the official OTLP ingestion schema.
servers:
  - url: http://127.0.0.1:4319
    description: Proposed localhost query listener (not implemented)
paths:
  /api/v1/health:
    get:
      summary: Query API health status
      responses:
        '200':
          description: Health check response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok, degraded]
                  version:
                    type: string
                required: [status, version]
