{
  "openapi": "3.1.0",
  "info": {
    "title": "Request X-Ray Query API",
    "version": "0.1.0",
    "description": "Read-only loopback API for persisted traces."
  },
  "servers": [
    {
      "url": "http://127.0.0.1:4731"
    }
  ],
  "paths": {
    "/api/v1/health": {
      "get": {
        "operationId": "getHealth",
        "responses": {
          "200": {
            "description": "Successful response.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Health"
                }
              }
            }
          },
          "403": {
            "description": "Forbidden authority or origin.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "503": {
            "description": "The query service is temporarily unavailable.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "default": {
            "description": "Other request error.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/traces": {
      "get": {
        "operationId": "listTraces",
        "responses": {
          "200": {
            "description": "Successful response.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/TracePage"
                }
              }
            }
          },
          "400": {
            "description": "Invalid path, query or cursor.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "403": {
            "description": "Forbidden authority or origin.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "503": {
            "description": "The query service is temporarily unavailable.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "default": {
            "description": "Other request error.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "parameters": [
          {
            "name": "limit",
            "in": "query",
            "description": "Maximum number of records.",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 100,
              "default": 50
            }
          },
          {
            "name": "cursor",
            "in": "query",
            "description": "Opaque cursor from the preceding page.",
            "schema": {
              "$ref": "#/components/schemas/Cursor"
            }
          },
          {
            "name": "traceId",
            "in": "query",
            "description": "Exact trace ID.",
            "schema": {
              "type": "string",
              "pattern": "^[0-9a-fA-F]{32}$"
            }
          },
          {
            "name": "service",
            "in": "query",
            "description": "Exact observed service name.",
            "schema": {
              "type": "string",
              "minLength": 1,
              "maxLength": 512
            }
          },
          {
            "name": "route",
            "in": "query",
            "description": "Exact observed http.route value.",
            "schema": {
              "type": "string",
              "minLength": 1,
              "maxLength": 512
            }
          },
          {
            "name": "error",
            "in": "query",
            "description": "Filter by whether any persisted span recorded an error.",
            "schema": {
              "type": "boolean"
            }
          },
          {
            "name": "status",
            "in": "query",
            "description": "Observed trace status.",
            "schema": {
              "$ref": "#/components/schemas/TraceStatus"
            }
          },
          {
            "name": "sinceNs",
            "in": "query",
            "description": "Inclusive lower bound on trace start in Unix nanoseconds.",
            "schema": {
              "$ref": "#/components/schemas/Nanoseconds"
            }
          },
          {
            "name": "untilNs",
            "in": "query",
            "description": "Exclusive upper bound on trace start in Unix nanoseconds.",
            "schema": {
              "$ref": "#/components/schemas/Nanoseconds"
            }
          },
          {
            "name": "durationMinNs",
            "in": "query",
            "description": "Inclusive minimum trace duration in nanoseconds.",
            "schema": {
              "$ref": "#/components/schemas/Nanoseconds"
            }
          },
          {
            "name": "durationMaxNs",
            "in": "query",
            "description": "Inclusive maximum trace duration in nanoseconds.",
            "schema": {
              "$ref": "#/components/schemas/Nanoseconds"
            }
          }
        ]
      }
    },
    "/api/v1/traces/{id}": {
      "get": {
        "operationId": "getTrace",
        "responses": {
          "200": {
            "description": "Successful response.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Trace"
                }
              }
            }
          },
          "400": {
            "description": "Invalid path, query or cursor.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "403": {
            "description": "Forbidden authority or origin.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "404": {
            "description": "Trace not found.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "503": {
            "description": "The query service is temporarily unavailable.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "default": {
            "description": "Other request error.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[0-9a-fA-F]{32}$"
            }
          }
        ]
      }
    },
    "/api/v1/traces/{id}/spans": {
      "get": {
        "operationId": "listSpans",
        "responses": {
          "200": {
            "description": "Successful response.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SpanPage"
                }
              }
            }
          },
          "400": {
            "description": "Invalid path, query or cursor.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "403": {
            "description": "Forbidden authority or origin.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "404": {
            "description": "Trace not found.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "413": {
            "description": "The requested page exceeds the response size limit.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "503": {
            "description": "The query service is temporarily unavailable.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "default": {
            "description": "Other request error.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "pattern": "^[0-9a-fA-F]{32}$"
            }
          },
          {
            "name": "limit",
            "in": "query",
            "description": "Maximum number of records.",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 100,
              "default": 20
            }
          },
          {
            "name": "cursor",
            "in": "query",
            "description": "Opaque cursor from the preceding page.",
            "schema": {
              "$ref": "#/components/schemas/Cursor"
            }
          }
        ]
      }
    },
    "/api/v1/services": {
      "get": {
        "operationId": "listServices",
        "responses": {
          "200": {
            "description": "Successful response.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ServicePage"
                }
              }
            }
          },
          "400": {
            "description": "Invalid path, query or cursor.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "403": {
            "description": "Forbidden authority or origin.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "413": {
            "description": "The requested page exceeds the response size limit.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "503": {
            "description": "The query service is temporarily unavailable.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "default": {
            "description": "Other request error.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "parameters": [
          {
            "name": "limit",
            "in": "query",
            "description": "Maximum number of records.",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 100,
              "default": 50
            }
          },
          {
            "name": "cursor",
            "in": "query",
            "description": "Opaque cursor from the preceding page.",
            "schema": {
              "$ref": "#/components/schemas/Cursor"
            }
          }
        ]
      }
    },
    "/api/v1/stats": {
      "get": {
        "operationId": "getStats",
        "responses": {
          "200": {
            "description": "Successful response.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Stats"
                }
              }
            }
          },
          "403": {
            "description": "Forbidden authority or origin.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "503": {
            "description": "The query service is temporarily unavailable.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "default": {
            "description": "Other request error.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/config/capabilities": {
      "get": {
        "operationId": "getCapabilities",
        "responses": {
          "200": {
            "description": "Successful response.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Capabilities"
                }
              }
            }
          },
          "403": {
            "description": "Forbidden authority or origin.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "503": {
            "description": "The query service is temporarily unavailable.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "default": {
            "description": "Other request error.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    }
  },
  "components": {
    "schemas": {
      "Nanoseconds": {
        "type": "string",
        "pattern": "^[0-9]{1,19}$",
        "description": "Nonnegative signed-64-bit integer encoded as a decimal string."
      },
      "TraceId": {
        "type": "string",
        "pattern": "^[0-9a-f]{32}$"
      },
      "SpanId": {
        "type": "string",
        "pattern": "^[0-9a-f]{16}$"
      },
      "Cursor": {
        "type": "string",
        "pattern": "^[A-Za-z0-9_-]+$"
      },
      "TraceStatus": {
        "type": "string",
        "enum": [
          "error",
          "ok",
          "unset"
        ]
      },
      "Error": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "error"
        ],
        "properties": {
          "error": {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "code",
              "message",
              "requestId"
            ],
            "properties": {
              "code": {
                "type": "string",
                "enum": [
                  "FORBIDDEN",
                  "INVALID_QUERY",
                  "INVALID_TRACE_ID",
                  "TRACE_NOT_FOUND",
                  "RESPONSE_TOO_LARGE",
                  "STORAGE_UNAVAILABLE",
                  "NOT_FOUND",
                  "METHOD_NOT_ALLOWED"
                ]
              },
              "message": {
                "type": "string"
              },
              "requestId": {
                "type": "string"
              }
            }
          }
        }
      },
      "Health": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "status",
          "version"
        ],
        "properties": {
          "status": {
            "type": "string",
            "enum": [
              "ok"
            ]
          },
          "version": {
            "type": "string"
          }
        }
      },
      "Completeness": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "state",
          "missingParentCount",
          "lastSeenAtUnixNs"
        ],
        "properties": {
          "state": {
            "type": "string",
            "enum": [
              "observed",
              "missing_parents"
            ]
          },
          "missingParentCount": {
            "type": "integer",
            "minimum": 0
          },
          "lastSeenAtUnixNs": {
            "$ref": "#/components/schemas/Nanoseconds"
          }
        }
      },
      "Trace": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "traceId",
          "startedAtUnixNs",
          "endedAtUnixNs",
          "durationNs",
          "firstSeenAtUnixNs",
          "spanCount",
          "hasError",
          "status",
          "completeness",
          "serviceCount"
        ],
        "properties": {
          "traceId": {
            "$ref": "#/components/schemas/TraceId"
          },
          "startedAtUnixNs": {
            "$ref": "#/components/schemas/Nanoseconds"
          },
          "endedAtUnixNs": {
            "$ref": "#/components/schemas/Nanoseconds"
          },
          "durationNs": {
            "$ref": "#/components/schemas/Nanoseconds"
          },
          "firstSeenAtUnixNs": {
            "$ref": "#/components/schemas/Nanoseconds"
          },
          "spanCount": {
            "type": "integer",
            "minimum": 0
          },
          "hasError": {
            "type": "boolean"
          },
          "status": {
            "$ref": "#/components/schemas/TraceStatus"
          },
          "completeness": {
            "$ref": "#/components/schemas/Completeness"
          },
          "serviceCount": {
            "type": "integer",
            "minimum": 0
          }
        }
      },
      "Status": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "code",
          "message"
        ],
        "properties": {
          "code": {
            "type": "integer"
          },
          "message": {
            "anyOf": [
              {
                "type": "string"
              },
              {
                "type": "null"
              }
            ]
          }
        }
      },
      "Entity": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "schemaUrl",
          "entityType",
          "idKeys",
          "descriptionKeys"
        ],
        "properties": {
          "schemaUrl": {
            "type": "string"
          },
          "entityType": {
            "type": "string"
          },
          "idKeys": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "descriptionKeys": {
            "type": "array",
            "items": {
              "type": "string"
            }
          }
        }
      },
      "Resource": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "attributes",
          "droppedAttributesCount",
          "entityRefs"
        ],
        "properties": {
          "attributes": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Attribute"
            }
          },
          "droppedAttributesCount": {
            "type": "integer",
            "minimum": 0
          },
          "entityRefs": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Entity"
            }
          }
        }
      },
      "Scope": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "name",
          "version",
          "attributes",
          "droppedAttributesCount"
        ],
        "properties": {
          "name": {
            "type": "string"
          },
          "version": {
            "type": "string"
          },
          "attributes": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Attribute"
            }
          },
          "droppedAttributesCount": {
            "type": "integer",
            "minimum": 0
          }
        }
      },
      "Event": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "name",
          "timeUnixNs",
          "attributes",
          "droppedAttributesCount"
        ],
        "properties": {
          "name": {
            "type": "string"
          },
          "timeUnixNs": {
            "$ref": "#/components/schemas/Nanoseconds"
          },
          "attributes": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Attribute"
            }
          },
          "droppedAttributesCount": {
            "type": "integer",
            "minimum": 0
          }
        }
      },
      "Link": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "traceId",
          "spanId",
          "traceState",
          "flags",
          "attributes",
          "droppedAttributesCount"
        ],
        "properties": {
          "traceId": {
            "$ref": "#/components/schemas/TraceId"
          },
          "spanId": {
            "$ref": "#/components/schemas/SpanId"
          },
          "traceState": {
            "type": "string"
          },
          "flags": {
            "type": "integer",
            "minimum": 0
          },
          "attributes": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Attribute"
            }
          },
          "droppedAttributesCount": {
            "type": "integer",
            "minimum": 0
          }
        }
      },
      "Span": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "traceId",
          "spanId",
          "parentSpanId",
          "name",
          "kind",
          "traceState",
          "flags",
          "startedAtUnixNs",
          "endedAtUnixNs",
          "durationNs",
          "status",
          "route",
          "resourceSchemaUrl",
          "resource",
          "scopeSchemaUrl",
          "scope",
          "attributes",
          "events",
          "links",
          "droppedAttributesCount",
          "droppedEventsCount",
          "droppedLinksCount"
        ],
        "properties": {
          "traceId": {
            "$ref": "#/components/schemas/TraceId"
          },
          "spanId": {
            "$ref": "#/components/schemas/SpanId"
          },
          "parentSpanId": {
            "anyOf": [
              {
                "$ref": "#/components/schemas/SpanId"
              },
              {
                "type": "null"
              }
            ]
          },
          "name": {
            "type": "string"
          },
          "kind": {
            "type": "integer"
          },
          "traceState": {
            "type": "string"
          },
          "flags": {
            "type": "integer",
            "minimum": 0
          },
          "startedAtUnixNs": {
            "$ref": "#/components/schemas/Nanoseconds"
          },
          "endedAtUnixNs": {
            "$ref": "#/components/schemas/Nanoseconds"
          },
          "durationNs": {
            "$ref": "#/components/schemas/Nanoseconds"
          },
          "status": {
            "anyOf": [
              {
                "$ref": "#/components/schemas/Status"
              },
              {
                "type": "null"
              }
            ]
          },
          "route": {
            "anyOf": [
              {
                "type": "string"
              },
              {
                "type": "null"
              }
            ]
          },
          "resourceSchemaUrl": {
            "type": "string"
          },
          "resource": {
            "anyOf": [
              {
                "$ref": "#/components/schemas/Resource"
              },
              {
                "type": "null"
              }
            ]
          },
          "scopeSchemaUrl": {
            "type": "string"
          },
          "scope": {
            "anyOf": [
              {
                "$ref": "#/components/schemas/Scope"
              },
              {
                "type": "null"
              }
            ]
          },
          "attributes": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Attribute"
            }
          },
          "events": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Event"
            }
          },
          "links": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Link"
            }
          },
          "droppedAttributesCount": {
            "type": "integer",
            "minimum": 0
          },
          "droppedEventsCount": {
            "type": "integer",
            "minimum": 0
          },
          "droppedLinksCount": {
            "type": "integer",
            "minimum": 0
          }
        }
      },
      "Attribute": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "key",
          "value"
        ],
        "properties": {
          "key": {
            "type": "string"
          },
          "value": {
            "anyOf": [
              {
                "$ref": "#/components/schemas/AttributeValue"
              },
              {
                "type": "null"
              }
            ]
          }
        }
      },
      "AttributeValue": {
        "oneOf": [
          {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "type"
            ],
            "properties": {
              "type": {
                "type": "string",
                "enum": [
