name: Node.js CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  PNPM_VERSION: 9.12.0

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node.js ${{ matrix.node }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node }}
    - name: Enable corepack
      run: corepack enable
    - name: Activate pnpm ${{ env.PNPM_VERSION }}
      run: corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Run linting
      run: pnpm lint --if-present
    - name: Build Node SDK and NestJS lab
      run: |
        pnpm --filter @request-xray/node build
        pnpm --filter request-xray-test-lab build
    - name: Typecheck workspace
      run: pnpm typecheck
    - name: Run tests and check generated query client
      run: pnpm test --if-present
    - name: Smoke test the NestJS lab
      run: pnpm --filter request-xray-test-lab smoke
    - name: Build native collector
      run: cargo build --locked -p xray-collector
    - name: Test SDK with the native collector
      run: pnpm --filter @request-xray/node test:e2e
    - name: Check for unused dependencies
      run: pnpm dedupe --check
